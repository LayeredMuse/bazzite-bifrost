# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-bifrost
description: Norse-themed atomic Bazzite image bridging upstairs Niri/Noctalia desktop and downstairs Gamescope HDR TV sessions.
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: latest

modules:
  - type: files
    files:
      - usr: /usr
      - etc: /etc

  - type: dnf
    repos:
      files:
        - https://raw.githubusercontent.com/terrapkg/subatomic-repos/main/terra.repo
      copr:
        - kylegospo/bazzite
    install:
      packages:
        - niri
        - noctalia-shell
        - gamescope-session
        - wlr-randr
        - pipewire
        - wireplumber
        - alacritty

  - type: systemd
    system:
      masked:
        - gdm.service
        - sddm.service
        - lightdm.service

  - type: kargs
    kargs:
      - nvidia_drm.modeset=1
      - nvidia_drm.fbdev=1
