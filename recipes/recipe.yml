# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-bifrost
description: Norse-themed atomic Bazzite image bridging upstairs Niri/Noctalia desktop and downstairs Gamescope HDR TV sessions.
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: latest

modules:
  - type: files
    files:
      - usr: /usr
      - etc: /etc

  - type: dnf
    repos:
      - https://pkg.terrapkg.com/terra-release.noarch.rpm
      - copr:kylegospo/bazzite
    install:
      - niri
      - noctalia-shell
      - gamescope-session
      - wlr-randr
      - pipewire
      - wireplumber
      - alacritty

  - type: systemd
    system:
      disabled:
        - sddm.service
        - gdm.service
      masked:
        - sddm.service
        - gdm.service

  - type: kargs
    kargs:
      - nvidia_drm.modeset=1
      - nvidia_drm.fbdev=1
